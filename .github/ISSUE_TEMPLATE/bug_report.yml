name: Bug report
description: Report a problem with the DnBOX nightly website, installer, Remote, or this repository.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for a report. Please fill in every required field.
        Do not attach private backups, credentials, or raw captures you do not want public.
        For a vulnerability, use the [security advisory form](https://github.com/gobbajogger/DnBOX-nightly/security/advisories/new) instead of this form.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Website
        - Installer
        - Browser Remote
        - TouchOSC
        - Import / export
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Keyboard model
      options:
        - SMK-37 Elite
        - SMK-37 Pro
        - FM-1
        - Other / not sure
        - Not applicable
    validations:
      required: true
  - type: input
    id: firmware_version
    attributes:
      label: Firmware or site version
      description: Version shown on the device, in the installer, or the site build you were using (for example 0.0.25.1 or a nightly SHA).
      placeholder: 0.0.25.1
    validations:
      required: true
  - type: dropdown
    id: backup_done
    attributes:
      label: If this involved an install, did you back up your sample slots first?
      options:
        - "Yes"
        - "No"
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Optional. Browser and OS, host software (for example Loopy Pro version), or other detail that is safe to publish.
