<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DnBOX Remote Workspace</title><link rel="stylesheet" href="style.css"></head><body><header><strong>DnBOX <small>REMOTE</small></strong><span class="source">Example · Not connected</span><div class="top-actions"><button id="undo">Undo</button><button id="redo">Redo</button><button id="review">Review</button><button id="draft-save">Download draft</button><label class="draft-open">Open draft<input id="draft-file" type="file" accept=".json,application/json"></label><button id="apply-unavailable" disabled title="Not connected">Apply to instrument</button></div></header><nav aria-label="Workspace"><button data-view="roll" aria-current="page">Roll</button><button data-view="drums">Drums</button><button data-view="locks">Locks / Motion</button><button data-view="sound">Sound</button><button data-view="mix">Mix / FX</button><button data-view="patterns">Launch</button><button data-view="song">Song</button><button data-view="files">Files / MIDI</button></nav><main><div class="context"><label>Part <select id="part"><option value="chicago">Bass A</option><option value="miami">Bass B</option><option value="drum909">909</option><option value="drum808">808</option><option value="breaks">BREAK</option></select></label><span id="context-title">Piano roll</span></div><section id="roll-view"><div class="toolbar" role="toolbar" aria-label="Roll tools"><button data-mode="select" aria-pressed="true">Select</button><button data-mode="move">Move</button><button data-mode="draw">Draw</button><button data-mode="length">Length</button><button data-mode="pan">Pan</button><button id="multi" aria-pressed="false">Group</button><button id="copy">Copy</button><button id="paste">Paste</button><button id="delete">Delete</button><label>Snap <select id="snap"><option value="off">Off · samples</option><option value="1/4">1/4</option><option value="1/8">1/8</option><option value="1/16" selected>1/16</option><option value="1/32">1/32</option></select></label><span id="music-context"></span><span class="music-unit">Quarter beats</span><label>Zoom <input id="zoom" type="range" min="1" max="4" step=".25" value="1"></label></div><div class="editor"><div class="roll-stack"><div id="ruler-scroll" aria-hidden="true"><div id="time-ruler"></div></div><div id="roll-scroll" tabindex="0" aria-label="Piano roll. Scroll pitch and time. Use inspector for precise edits."><div id="roll-grid"></div></div><div class="lane-label"><select id="lane-kind" aria-label="Per-note lane parameter"><option value="velocity">Velocity</option><option value="chance">Chance / condition</option></select></div><div id="velocity" aria-label="Velocity lane"></div></div></div></section><section id="other-view" hidden></section></main><footer id="status" role="status" aria-live="polite">Loading…</footer><dialog id="note-dialog" aria-label="Precise local note edit"><div id="inspector"></div><details id="part-context"><summary>Part context</summary><div id="context-controls"></div></details><button id="note-close" type="button">Return to roll</button></dialog><dialog id="review-dialog"><form method="dialog"><h2>Local changes</h2><div id="changes"></div><p>Not connected.</p><button>Return</button></form></dialog><dialog id="draft-dialog"><h2>Open local workspace draft</h2><p id="draft-preview"></p><button id="draft-cancel" type="button">Cancel</button><button id="draft-replace" type="button" disabled>Replace local draft</button></dialog><script type="module" src="app.mjs"></script></body></html>
