<!doctype html><meta charset="utf-8"><title>Past defect: pitch shading covers time grid</title>
<!-- Minimal reproduction of PR132 9809abc grid layering. No private capture. -->
<style>:root{--row:20px;--step:80px}*{box-sizing:border-box}body{margin:0;background:#050a0d}#roll-scroll{width:100vw;height:100vh;overflow:auto}#roll-grid{position:relative;width:1280px;height:2560px;background:repeating-linear-gradient(to right,#415052 0 1px,transparent 1px 1280px),repeating-linear-gradient(to right,#293d43 0 1px,transparent 1px 320px),repeating-linear-gradient(to right,#19262b 0 1px,transparent 1px 80px),#050a0d}.black-key{position:absolute;left:0;right:0;height:19px;background:#101a1f}</style>
<div id="roll-scroll"><div id="roll-grid"></div></div><script>for(let row=0;row<128;row++){const note=127-row;if([1,3,6,8,10].includes(note%12)){const x=document.createElement('i');x.className='black-key';x.style.top=row*20+'px';document.querySelector('#roll-grid').append(x)}}</script>
